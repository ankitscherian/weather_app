name: Release

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest_tag" ]; then
            next_version="0.0.1"
          else
            version="${latest_tag#v}"
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            patch=$(echo "$version" | cut -d. -f3)
            next_version="${major}.${minor}.$((patch + 1))"
          fi
          echo "Latest tag: ${latest_tag:-none}, next version: $next_version"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"

  build:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew compileJava -PreleaseVersion=${{ needs.determine-version.outputs.version }}

  unit-tests:
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test jacocoTestReport -PreleaseVersion=${{ needs.determine-version.outputs.version }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results-${{ needs.determine-version.outputs.version }}
          path: build/reports/tests/test

  docker-image:
    needs: [determine-version, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release jar
        run: ./gradlew bootJar -PreleaseVersion=${{ needs.determine-version.outputs.version }}

      - name: Build docker image
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: docker build --build-arg RELEASE_VERSION="$VERSION" -t "weather-app:$VERSION" .

      - name: Show version and image tag
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          TAG: ${{ needs.determine-version.outputs.tag }}
        run: |
          {
            echo "### Release image built"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| App version | $VERSION |"
            echo "| Git tag | $TAG |"
            echo "| Image tag | weather-app:$VERSION |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: weather-app:$VERSION"
          echo "Version: $VERSION"

      - name: Upload release jar
        uses: actions/upload-artifact@v4
        with:
          name: release-jar-${{ needs.determine-version.outputs.version }}
          path: build/libs/*.jar

  publish-release:
    needs: [determine-version, docker-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release jar
        uses: actions/download-artifact@v4
        with:
          name: release-jar-${{ needs.determine-version.outputs.version }}
          path: build/libs

      - name: Create tag
        run: |
          git tag ${{ needs.determine-version.outputs.tag }}
          git push origin ${{ needs.determine-version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag }}
          name: ${{ needs.determine-version.outputs.tag }}
          generate_release_notes: true
          files: build/libs/*.jar
